    pt: "Pesquisadora associada, Centro de Objetivos de Desenvolvimento Sustentável para a América Latina e o Caribe, Universidad de los Andes"
  wps:
  - "WP3"
  bio:
    es: "Natalia Niño-Machado es doctora en Estudios Sociales de la Ciencia y la Tecnología de la Universidad de Edimburgo e investigadora asociada de la Universidad de los Andes. Su trabajo se sitúa en la intersección entre antropología, salud pública, ciencias biológicas y cambio climático, con énfasis en América Latina y el Caribe. Su investigación emplea enfoques etnográficos y métodos cualitativos para comprender cómo se producen, interpretan y utilizan conocimientos sobre el clima y la salud, y cómo estos conocimientos se incorporan en la toma de decisiones. Ha codirigido proyectos de co-diseño entre comunidades científicas, entidades públicas y organizaciones de la sociedad civil para fortalecer la respuesta frente a riesgos climáticos y sus efectos en la salud."
    en: "Natalia Niño-Machado holds a PhD in Science and Technology Studies from the University of Edinburgh and is an associate researcher at Universidad de los Andes. Her work lies at the intersection of anthropology, public health, the biological sciences and climate change, with a focus on Latin America and the Caribbean. She uses ethnographic approaches and qualitative methods to understand how knowledge about climate and health is produced, interpreted and used, and how it is incorporated into decision-making. She has co-led co-design projects bringing together scientific communities, public bodies and civil society organisations to strengthen responses to climate risks and their health effects."
    pt: "Natalia Niño-Machado é doutora em Estudos Sociais da Ciência e da Tecnologia pela Universidade de Edimburgo e pesquisadora associada da Universidad de los Andes. Seu trabalho situa-se na interseção entre antropologia, saúde pública, ciências biológicas e mudanças climáticas, com ênfase na América Latina e no Caribe. Sua pesquisa utiliza abordagens etnográficas e métodos qualitativos para compreender como os conhecimentos sobre clima e saúde são produzidos, interpretados e utilizados, e como são incorporados à tomada de decisões. Codirigiu projetos de codesenho entre comunidades científicas, órgãos públicos e organizações da sociedade civil para fortalecer a resposta aos riscos climáticos e a seus efeitos na saúde."
