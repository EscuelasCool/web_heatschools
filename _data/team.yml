  bio:
    es: "José Daniel Conejeros es Lagrange Fellow en la ISI Foundation, en Turín, Italia. También está afiliado a la Pontificia Universidad Católica de Chile, donde colabora con la Escuela de Gobierno y con el Centro Nacional de Excelencia SENTINET. Su formación en estadística y ciencias sociales combina modelamiento epidemiológico espaciotemporal, filogeografía y ciencia de datos para estudiar enfermedades infecciosas en América Latina, como la tuberculosis y la influenza. Además, analiza cómo el clima y el ambiente influyen en la salud de distintas poblaciones y etapas vitales. Promueve la ciencia abierta, participa en redes regionales y desarrolla herramientas de código abierto para la investigación reproducible."
    en: "José Daniel Conejeros is a Lagrange Fellow at the ISI Foundation in Turin, Italy. He is also affiliated with the Pontificia Universidad Católica de Chile, where he collaborates with the School of Government and the SENTINET National Centre of Excellence. His background in statistics and social sciences combines spatiotemporal epidemiological modelling, phylogeography and data science to study infectious diseases in Latin America, such as tuberculosis and influenza. He also examines how climate and the environment shape health across different populations and life stages. He promotes open science, takes part in regional networks and develops open-source tools for reproducible research."
    pt: "José Daniel Conejeros é Lagrange Fellow na ISI Foundation, em Turim, Itália. Também é afiliado à Pontificia Universidad Católica de Chile, onde colabora com a Escola de Governo e com o Centro Nacional de Excelência SENTINET. Sua formação em estatística e ciências sociais combina modelagem epidemiológica espaço-temporal, filogeografia e ciência de dados para estudar doenças infecciosas na América Latina, como a tuberculose e a influenza. Além disso, analisa como o clima e o ambiente influenciam a saúde de diferentes populações e fases da vida. Promove a ciência aberta, participa de redes regionais e desenvolve ferramentas de código aberto para pesquisa reprodutível."
