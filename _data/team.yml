    en: "Research Fellow, Lancet Countdown Latin America"
    pt: "Pesquisadora, Lancet Countdown América Latina"
  wps:
  - "WP2.1"
  bio:
    es: "Rayana Palharini es meteoróloga e investigadora, y su trayectoria se caracteriza por enfoques interdisciplinarios sobre clima, ambiente y salud pública. Es titulada en Meteorología por la Universidad Federal de Campina Grande y en Administración de Empresas. Realizó su maestría y doctorado en Meteorología en el Instituto Nacional de Investigaciones Espaciales (INPE) de Brasil, donde estudió eventos de precipitación extrema en Sudamérica a partir de estimaciones satelitales y su relación con los sistemas convectivos de mesoescala. Luego realizó estudios posdoctorales sobre clima, salud y políticas públicas. Actualmente es investigadora del Lancet Countdown Latinoamérica y colabora con el comité asesor de cambio climático del Ministerio de Ciencia, Tecnología, Conocimiento e Innovación de Chile. Su producción científica abarca la teledetección atmosférica, las estimaciones satelitales de precipitación intensa, los impactos de los eventos climáticos extremos en la salud, la gestión del riesgo y las políticas ambientales."
    en: "Rayana Palharini is a meteorologist and researcher whose career is characterised by interdisciplinary approaches to climate, environment and public health. She holds degrees in Meteorology from the Federal University of Campina Grande and in Business Administration. She completed her master's and doctorate in Meteorology at Brazil's National Institute for Space Research (INPE), where she studied extreme precipitation events in South America using satellite estimates and their relationship with mesoscale convective systems. She then carried out postdoctoral research on climate, health and public policy. She is currently a research fellow at the Lancet Countdown Latin America and collaborates with the climate change advisory committee of Chile's Ministry of Science and Technology. Her work covers atmospheric remote sensing, satellite estimates of intense precipitation, the health impacts of extreme climate events, risk management and environmental policy."
    pt: "Rayana Palharini é meteorologista e pesquisadora, e sua trajetória é marcada por abordagens interdisciplinares sobre clima, ambiente e saúde pública. É graduada em Meteorologia pela Universidade Federal de Campina Grande e em Administração de Empresas. Fez mestrado e doutorado em Meteorologia no Instituto Nacional de Pesquisas Espaciais (INPE), onde estudou eventos de precipitação extrema na América do Sul a partir de estimativas por satélite e sua relação com sistemas convectivos de mesoescala. Em seguida, realizou pós-doutorado sobre clima, saúde e políticas públicas. Atualmente é pesquisadora do Lancet Countdown América Latina e colabora com o comitê consultivo de mudanças climáticas do Ministério da Ciência, Tecnologia, Conhecimento e Inovação do Chile. Sua produção científica abrange sensoriamento remoto atmosférico, estimativas de precipitação intensa por satélite, impactos de eventos climáticos extremos na saúde, gestão de riscos e políticas ambientais."
