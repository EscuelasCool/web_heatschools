  bio:
    es: "Pía Letelier es psicóloga clínica con formación en Ecopsicología. Su trabajo se desarrolla en la intersección entre salud mental, ecopsicología y problemáticas socioambientales, con especial énfasis en el enfoque de género y la crisis climática, así como en la comprensión de los contextos socioculturales. Ha participado en iniciativas de investigación y divulgación vinculadas a la salud mental y la relación humano-naturaleza. Actualmente se desempeña como asistente de investigación en estudios sobre salud mental y cambio climático, explorando las experiencias emocionales y sociales asociadas a la crisis ambiental desde una perspectiva interdisciplinaria."
    en: "Pía Letelier is a clinical psychologist trained in Ecopsychology. Her work lies at the intersection of mental health, ecopsychology and socio-environmental issues, with particular emphasis on gender and the climate crisis and on understanding sociocultural contexts. She has taken part in research and outreach initiatives on mental health and the human–nature relationship. She currently works as a research assistant on studies of mental health and climate change, exploring the emotional and social experiences associated with the environmental crisis from an interdisciplinary perspective."
    pt: "Pía Letelier é psicóloga clínica com formação em Ecopsicologia. Seu trabalho se desenvolve na interseção entre saúde mental, ecopsicologia e problemas socioambientais, com especial ênfase na perspectiva de gênero e na crise climática, bem como na compreensão dos contextos socioculturais. Participou de iniciativas de pesquisa e divulgação ligadas à saúde mental e à relação ser humano-natureza. Atualmente atua como assistente de pesquisa em estudos sobre saúde mental e mudanças climáticas, explorando as experiências emocionais e sociais associadas à crise ambiental a partir de uma perspectiva interdisciplinar."
