  affiliation:
    es: "Candidata a doctora, Departamento de Psicología, Universidad de Chile / Pontificia Universidad Católica de Chile / Instituto Milenio para la Investigación en Depresión y Personalidad (MIDAP)"
    en: "PhD candidate, Department of Psychology, Universidad de Chile / Pontificia Universidad Católica de Chile / Millennium Institute for Research in Depression and Personality (MIDAP)"
