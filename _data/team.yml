  wps:
  - "all"
  bio:
    es: "Catalina Leighton es investigadora chilena en salud pública, radicada en Londres, y coordinadora del proyecto. Con formación en ciencias biomédicas en Chile, es magíster en Salud Global y Desarrollo por el University College London, donde su tesis analizó en qué medida la evidencia sobre calor y salud ocupacional incorpora la perspectiva de género. Fue coautora de una revisión sistemática registrada en PROSPERO sobre medidas de protección frente al calor extremo en el trabajo, complementada con entrevistas a empresas chilenas; el estudio contribuyó a un informe nacional de evidencia para la Superintendencia de Seguridad Social (SUSESO). Durante la pandemia de COVID-19, coordinó trabajo de salud comunitaria con personal de primera línea en hospitales públicos y departamentos municipales de Santiago."
    en: "Catalina is a Chilean public health researcher based in London and the project's Coordinator. She holds an MSc in Global Health and Development from University College London, where her dissertation examined how far occupational heat-health evidence accounts for gender. She previously co-authored a PROSPERO-registered systematic review on workplace protection from extreme heat, which contributed to a national evidence report for Chile's Superintendency of Social Security. During the COVID-19 pandemic, she coordinated community health work with frontline staff across public hospitals and municipal departments in Santiago."
    pt: "Catalina Leighton é pesquisadora chilena em saúde pública, radicada em Londres, e coordenadora do projeto. Com formação em ciências biomédicas no Chile, é mestre em Saúde Global e Desenvolvimento pela University College London, onde sua dissertação analisou em que medida as evidências sobre calor e saúde ocupacional incorporam a perspectiva de gênero. Foi coautora de uma revisão sistemática registrada no PROSPERO sobre medidas de proteção contra o calor extremo no trabalho, complementada com entrevistas a empresas chilenas; o estudo contribuiu para um relatório nacional de evidências para a Superintendência de Seguridade Social do Chile (SUSESO). Durante a pandemia de COVID-19, coordenou trabalho de saúde comunitária com profissionais da linha de frente em hospitais públicos e departamentos municipais de Santiago."
