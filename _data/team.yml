  bio:
    es: "Tamara Hoffmann Ferrada es candidata a doctora en Psicoterapia por la Universidad de Chile y la Pontificia Universidad Católica de Chile. Su línea de investigación se centra en la ecoansiedad en jóvenes chilenos, articulando enfoques clínicos, socioculturales y contextuales. Psicóloga con amplia experiencia clínica y especialización de posgrado en atención a adolescentes y jóvenes, ha sido co-investigadora en diversos proyectos sobre salud mental y bienestar juvenil. En el ámbito socioambiental, ha liderado investigaciones pioneras sobre la relación entre cambio climático y salud mental en Chile. Desde 2025 es miembro de la Climate Psychology Alliance (Reino Unido) y es investigadora afiliada externa del grupo SERSus del centro Frontiers of Arctic and Global Resilience (FRONT) de la Universidad de Oulu, Finlandia. Fue miembro fundadora del Comité Científico de Cambio Climático en la elaboración del Informe Previo de Actualización de la Contribución Determinada a Nivel Nacional (NDC 2025) y expositora en Congreso Futuro 2026 sobre ecoansiedad."
    en: "Tamara Hoffmann Ferrada is a PhD candidate in Psychotherapy at the Universidad de Chile and the Pontificia Universidad Católica de Chile. Her research focuses on eco-anxiety among young people in Chile, bringing together clinical, sociocultural and contextual approaches. A psychologist with extensive clinical experience and postgraduate specialisation in adolescent and youth care, she has been a co-investigator on several projects on youth mental health and wellbeing. In the socio-environmental field, she has led pioneering research on the relationship between climate change and mental health in Chile. Since 2025 she has been a member of the Climate Psychology Alliance (UK), and she is an external affiliated researcher of the SERSus group at the Frontiers of Arctic and Global Resilience (FRONT) centre, University of Oulu, Finland. She was a founding member of the Scientific Committee on Climate Change for the preliminary report on Chile's updated Nationally Determined Contribution (NDC 2025) and spoke on eco-anxiety at Congreso Futuro 2026."
    pt: "Tamara Hoffmann Ferrada é doutoranda em Psicoterapia pela Universidad de Chile e pela Pontificia Universidad Católica de Chile. Sua linha de pesquisa centra-se na ecoansiedade entre jovens chilenos, articulando abordagens clínicas, socioculturais e contextuais. Psicóloga com ampla experiência clínica e especialização de pós-graduação no atendimento a adolescentes e jovens, foi co-pesquisadora em diversos projetos sobre saúde mental e bem-estar juvenil. No campo socioambiental, liderou pesquisas pioneiras sobre a relação entre mudanças climáticas e saúde mental no Chile. Desde 2025 é membro da Climate Psychology Alliance (Reino Unido) e pesquisadora afiliada externa do grupo SERSus do centro Frontiers of Arctic and Global Resilience (FRONT) da Universidade de Oulu, Finlândia. Foi membro fundadora do Comitê Científico de Mudanças Climáticas na elaboração do relatório prévio de atualização da Contribuição Nacionalmente Determinada do Chile (NDC 2025) e palestrante no Congreso Futuro 2026 sobre ecoansiedade."
