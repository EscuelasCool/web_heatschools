    en: "Camila Llerena is a researcher with a BSc in Biology from Universidad Peruana Cayetano Heredia and an MSc in Climate Studies from Wageningen University & Research (the Netherlands). Her research sits at the intersection of climate, ecosystems and human health, with a particular interest in the impacts of extreme heat, climate vulnerability and climate change adaptation in Latin America."
