  bio:
    es: "Martín Andrade es director ejecutivo de Corporación Ciudades, entidad sin fines de lucro cuya misión es disminuir la segregación urbana e impulsar la planificación integrada del territorio. Es arquitecto de la Pontificia Universidad Católica de Chile y máster en Medio Ambiente de la Universidad de Melbourne (Australia). Es cofundador de la Fundación Mi Parque y fue coordinador nacional de Parques Urbanos en el Ministerio de Vivienda y Urbanismo de Chile. Se desempeñó como arquitecto sénior en el equipo de planificación de espacios públicos de la Ciudad de Melbourne y fue director del Parque Metropolitano de Santiago."
    en: "Martín Andrade is Executive Director of Corporación Ciudades, a non-profit organisation whose mission is to reduce urban segregation and promote integrated territorial planning. He is an architect from the Pontificia Universidad Católica de Chile and holds a Master's in Environment from the University of Melbourne (Australia). He co-founded Fundación Mi Parque and was National Coordinator of Urban Parks at Chile's Ministry of Housing and Urban Development. He worked as a senior architect in the public space planning team of the City of Melbourne and was Director of the Parque Metropolitano de Santiago."
    pt: "Martín Andrade é diretor executivo da Corporación Ciudades, organização sem fins lucrativos cuja missão é reduzir a segregação urbana e promover o planejamento integrado do território. É arquiteto pela Pontificia Universidad Católica de Chile e mestre em Meio Ambiente pela Universidade de Melbourne (Austrália). É cofundador da Fundación Mi Parque e foi coordenador nacional de Parques Urbanos no Ministério da Habitação e Urbanismo do Chile. Atuou como arquiteto sênior na equipe de planejamento de espaços públicos da Cidade de Melbourne e foi diretor do Parque Metropolitano de Santiago."
