  bio:
    es: "Cirujana dentista, especialista en Salud Pública y magíster en Salud Pública por la Universidad de Chile, con mención en Epidemiología y Políticas Públicas, y con estudios de posgrado en Asentamientos Humanos y Medio Ambiente en la Pontificia Universidad Católica de Chile. Cuenta con diez años de experiencia en epidemiología, vigilancia sanitaria, gestión pública e investigación, además de trayectoria en docencia universitaria. Sus principales áreas de interés incluyen la epidemiología ambiental, el cambio climático y la salud, las desigualdades socioambientales y las políticas públicas. En EscuelasCool contribuye a la investigación sobre exposición al calor, salud escolar y estrategias de adaptación climática en Chile."
    en: "A dental surgeon and public health specialist, she holds a Master's in Public Health from the Universidad de Chile, with a concentration in Epidemiology and Public Policy, and has postgraduate training in Human Settlements and Environment from the Pontificia Universidad Católica de Chile. She has ten years of experience in epidemiology, health surveillance, public management and research, as well as university teaching. Her main interests include environmental epidemiology, climate change and health, socio-environmental inequalities and public policy. In EscuelasCool she contributes to research on heat exposure, school health and climate adaptation strategies in Chile."
    pt: "Cirurgiã-dentista, especialista em Saúde Pública e mestre em Saúde Pública pela Universidad de Chile, com ênfase em Epidemiologia e Políticas Públicas, e com estudos de pós-graduação em Assentamentos Humanos e Meio Ambiente na Pontificia Universidad Católica de Chile. Tem dez anos de experiência em epidemiologia, vigilância sanitária, gestão pública e pesquisa, além de trajetória na docência universitária. Suas principais áreas de interesse incluem epidemiologia ambiental, mudanças climáticas e saúde, desigualdades socioambientais e políticas públicas. No EscuelasCool, contribui para a pesquisa sobre exposição ao calor, saúde escolar e estratégias de adaptação climática no Chile."
