  bio:
    es: "Yasna es enfermera titulada de la Pontificia Universidad Católica de Chile, con un diplomado en Bioestadística y Políticas Públicas, un magíster en Salud Pública de la Universidad de Chile y un doctorado en Salud Global del University College London. Cuenta con experiencia posdoctoral en el University College London y la Universidad de Washington. Actualmente es investigadora principal y fundadora de IDECS (Instituto de Datos y Evidencia para el Clima y la Salud) en Chile. Participa en diversos proyectos nacionales e internacionales sobre cambio climático y salud de la población —especialmente sobre calor extremo y salud—, entre ellos el Lancet Countdown y otros grupos de investigación en las Américas. Es además investigadora adjunta en la Universidad Peruana Cayetano Heredia (Perú) y en la Escuela de Salud Pública y el Centro de Políticas Públicas de la Pontificia Universidad Católica de Chile."
    en: "Yasna is a registered nurse from the Pontificia Universidad Católica de Chile, with a postgraduate diploma in Biostatistics and Public Policy, a Master's in Public Health from the Universidad de Chile and a PhD in Global Health from University College London. She has postdoctoral experience at University College London and the University of Washington. She is currently Principal Investigator and founder of IDECS (Institute of Data and Evidence for Climate and Health) in Chile. She takes part in several national and international projects on climate change and population health —particularly extreme heat and health—, including the Lancet Countdown and other research groups across the Americas. She is also an adjunct researcher at Universidad Peruana Cayetano Heredia (Peru) and at the School of Public Health and the Public Policy Centre of the Pontificia Universidad Católica de Chile."
    pt: "Yasna é enfermeira formada pela Pontificia Universidad Católica de Chile, com especialização em Bioestatística e Políticas Públicas, mestrado em Saúde Pública pela Universidad de Chile e doutorado em Saúde Global pela University College London. Tem experiência de pós-doutorado na University College London e na Universidade de Washington. Atualmente é pesquisadora principal e fundadora do IDECS (Instituto de Dados e Evidências para o Clima e a Saúde) no Chile. Participa de diversos projetos nacionais e internacionais sobre mudanças climáticas e saúde da população —especialmente sobre calor extremo e saúde—, entre eles o Lancet Countdown e outros grupos de pesquisa nas Américas. É também pesquisadora adjunta da Universidad Peruana Cayetano Heredia (Peru) e da Escola de Saúde Pública e do Centro de Políticas Públicas da Pontificia Universidad Católica de Chile."
