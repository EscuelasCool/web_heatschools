# ============================================================
#  Configuración del CMS visual (Sveltia) — EscuelasCool, trilingüe
#  Editor en https://escuelascool.org/admin/
#  Falta solo reemplazar base_url por la URL de tu Cloudflare Worker
#  (ver README, pasos 6 y 7).
# ============================================================

backend:
  name: github
  repo: HeatSchools/heatschools
  branch: main
  base_url: https://TU-WORKER.tu-subdominio.workers.dev   # <-- autenticador (Cloudflare Worker)

site_url: https://escuelascool.org
locale: es
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # ---------- Portadas (una por idioma) ----------
  - name: inicio
    label: "Portada"
    files:
      - name: inicio_es
        label: "Portada · Español"
        file: "index.md"
        fields:
          - { label: Layout, name: layout, widget: hidden, default: home }
          - { label: Idioma, name: lang, widget: hidden, default: es }
          - { label: Ref, name: ref, widget: hidden, default: home }
          - { label: Título interno, name: title, widget: hidden, default: "Inicio" }
          - { label: Permalink, name: permalink, widget: hidden, default: "/" }
          - { label: "Título principal", name: hero_title, widget: string, hint: "Pon entre asteriscos la parte que va en naranja y cursiva, p. ej. *amenaza silenciosa*" }
          - { label: "Frase de entrada", name: hero_lead, widget: text }
          - { label: "Etiquetas bajo el título", name: badges, widget: list, field: { label: "Etiqueta", name: badge, widget: string } }
          - { label: "Sobre el proyecto: título", name: about_title, widget: string }
          - { label: "Sobre el proyecto: texto", name: about_body, widget: markdown }
          - label: "Cifras destacadas"
            name: stats
            widget: list
            summary: "{{fields.num}} {{fields.label}}"
            fields:
              - { label: "Cifra", name: num, widget: string }
              - { label: "Texto", name: label, widget: string }
          - { label: "Investigación: título", name: research_title, widget: string }
          - label: "Líneas de investigación"
            name: research_lines
            widget: list
            summary: "{{fields.icon}} {{fields.title}}"
            fields:
              - { label: "Emoji", name: icon, widget: string, required: false }
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: text, widget: text }
          - { label: "Contacto: título", name: contact_title, widget: string }
          - { label: "Contacto: texto", name: contact_text, widget: text }
          - { label: "Contenido adicional (opcional, al final de la portada)", name: body, widget: markdown, required: false }
      - name: inicio_en
        label: "Home · English"
        file: "en/index.md"
        fields:
          - { label: Layout, name: layout, widget: hidden, default: home }
          - { label: Idioma, name: lang, widget: hidden, default: en }
          - { label: Ref, name: ref, widget: hidden, default: home }
          - { label: Título interno, name: title, widget: hidden, default: "Home" }
          - { label: Permalink, name: permalink, widget: hidden, default: "/en/" }
          - { label: "Main title", name: hero_title, widget: string, hint: "Wrap the orange italic part in asterisks, e.g. *Silent Killer*" }
          - { label: "Lead sentence", name: hero_lead, widget: text }
          - { label: "Tags under the title", name: badges, widget: list, field: { label: "Tag", name: badge, widget: string } }
          - { label: "About: title", name: about_title, widget: string }
          - { label: "About: text", name: about_body, widget: markdown }
          - label: "Key figures"
            name: stats
            widget: list
            summary: "{{fields.num}} {{fields.label}}"
            fields:
              - { label: "Figure", name: num, widget: string }
              - { label: "Text", name: label, widget: string }
          - { label: "Research: title", name: research_title, widget: string }
          - label: "Research lines"
            name: research_lines
            widget: list
            summary: "{{fields.icon}} {{fields.title}}"
            fields:
              - { label: "Emoji", name: icon, widget: string, required: false }
              - { label: "Title", name: title, widget: string }
              - { label: "Text", name: text, widget: text }
          - { label: "Contact: title", name: contact_title, widget: string }
          - { label: "Contact: text", name: contact_text, widget: text }
          - { label: "Extra content (optional, end of home page)", name: body, widget: markdown, required: false }
      - name: inicio_pt
        label: "Página inicial · Português"
        file: "pt/index.md"
        fields:
          - { label: Layout, name: layout, widget: hidden, default: home }
          - { label: Idioma, name: lang, widget: hidden, default: pt }
          - { label: Ref, name: ref, widget: hidden, default: home }
          - { label: Título interno, name: title, widget: hidden, default: "Início" }
          - { label: Permalink, name: permalink, widget: hidden, default: "/pt/" }
          - { label: "Título principal", name: hero_title, widget: string, hint: "Coloque entre asteriscos a parte em laranja e itálico, p. ex. *ameaça silenciosa*" }
          - { label: "Frase de abertura", name: hero_lead, widget: text }
          - { label: "Etiquetas sob o título", name: badges, widget: list, field: { label: "Etiqueta", name: badge, widget: string } }
          - { label: "Sobre o projeto: título", name: about_title, widget: string }
          - { label: "Sobre o projeto: texto", name: about_body, widget: markdown }
          - label: "Números em destaque"
            name: stats
            widget: list
            summary: "{{fields.num}} {{fields.label}}"
            fields:
              - { label: "Número", name: num, widget: string }
              - { label: "Texto", name: label, widget: string }
          - { label: "Pesquisa: título", name: research_title, widget: string }
          - label: "Linhas de pesquisa"
            name: research_lines
            widget: list
            summary: "{{fields.icon}} {{fields.title}}"
            fields:
              - { label: "Emoji", name: icon, widget: string, required: false }
              - { label: "Título", name: title, widget: string }
              - { label: "Texto", name: text, widget: text }
          - { label: "Contato: título", name: contact_title, widget: string }
          - { label: "Contato: texto", name: contact_text, widget: text }
          - { label: "Conteúdo adicional (opcional, final da página inicial)", name: body, widget: markdown, required: false }

  # ---------- Datos comunes (contacto e instituciones) ----------
  - name: datos
    label: "Datos del proyecto"
    files:
      - name: proyecto
        label: "Contacto, financiamiento e instituciones"
        file: "_data/project.yml"
        fields:
          - { label: "Investigadora principal", name: pi_name, widget: string }
          - { label: "Correo de contacto", name: email, widget: string }
          - { label: "Código Wellcome", name: grant, widget: string }
          - { label: "Institución anfitriona", name: host, widget: string }
          - { label: "Mostrar página de Equipo", name: show_team, widget: boolean, default: false, hint: "Desactivado = la página Equipo muestra 'Página en construcción'. Actívalo cuando estén todas las fichas." }
          - label: "Instituciones socias"
            name: partners
            widget: list
            summary: "{{fields.name}} ({{fields.country}})"
            fields:
              - { label: "Nombre", name: name, widget: string }
              - { label: "País", name: country, widget: select, options: ["PE", "CL", "CO", "BR", "INT"], hint: "INT = regional / internacional" }
              - { label: "Sitio web", name: link, widget: string, required: false }

  # ---------- Equipo (una lista por idioma; misma carpeta, filtrada) ----------
  - name: equipo_es
    label: "Equipo · Español"
    label_singular: "Persona"
    folder: "_team"
    filter: { field: lang, value: es }
    create: true
    slug: "{{fields.name | slugify}}-es"
    summary: "{{fields.name}} — {{fields.role}}"
    fields:
      - { label: Idioma, name: lang, widget: hidden, default: es }
      - { label: "Nombre", name: name, widget: string }
      - { label: "Rol", name: role, widget: string }
      - { label: "Afiliación", name: affiliation, widget: string }
      - { label: "Orden (menor = primero)", name: order, widget: number, default: 99, value_type: int }
      - { label: "Foto", name: photo, widget: image, required: false }
      - { label: "Enlace a perfil", name: link, widget: string, required: false }

  - name: equipo_en
    label: "Team · English"
    label_singular: "Person"
    folder: "_team"
    filter: { field: lang, value: en }
    create: true
    slug: "{{fields.name | slugify}}-en"
    summary: "{{fields.name}} — {{fields.role}}"
    fields:
      - { label: Language, name: lang, widget: hidden, default: en }
      - { label: "Name", name: name, widget: string }
      - { label: "Role", name: role, widget: string }
      - { label: "Affiliation", name: affiliation, widget: string }
      - { label: "Order (lower = first)", name: order, widget: number, default: 99, value_type: int }
      - { label: "Photo", name: photo, widget: image, required: false }
      - { label: "Profile link", name: link, widget: string, required: false }

  - name: equipo_pt
    label: "Equipe · Português"
    label_singular: "Pessoa"
    folder: "_team"
    filter: { field: lang, value: pt }
    create: true
    slug: "{{fields.name | slugify}}-pt"
    summary: "{{fields.name}} — {{fields.role}}"
    fields:
      - { label: Idioma, name: lang, widget: hidden, default: pt }
      - { label: "Nome", name: name, widget: string }
      - { label: "Função", name: role, widget: string }
      - { label: "Afiliação", name: affiliation, widget: string }
      - { label: "Ordem (menor = primeiro)", name: order, widget: number, default: 99, value_type: int }
      - { label: "Foto", name: photo, widget: image, required: false }
      - { label: "Link de perfil", name: link, widget: string, required: false }

  # ---------- Publicaciones (una sola lista, común a los 3 idiomas) ----------
  - name: publicaciones
    label: "Publicaciones"
    label_singular: "Publicación"
    folder: "_publications"
    create: true
    slug: "{{year}}-{{fields.title | slugify}}"
    summary: "{{fields.title}} ({{fields.year}})"
    fields:
      - { label: "Título", name: title, widget: string }
      - { label: "Autores", name: authors, widget: string }
      - { label: "Año", name: year, widget: number, value_type: int }
      - label: "Tipo"
        name: type
        widget: select
        options: ["Artículo", "Informe", "Datos", "Póster", "Otro"]
      - { label: "Revista / Fuente", name: venue, widget: string, required: false }
      - { label: "Enlace (DOI/URL)", name: link, widget: string, required: false }
      - { label: "Resumen", name: body, widget: markdown, required: false }

  # ---------- Noticias (una lista por idioma) ----------
  - name: news_es
    label: "Noticias · Español"
    label_singular: "Noticia"
    folder: "_news_es"
    create: true
    slug: "{{fields.title | slugify}}"
    summary: "{{fields.title}}"
    fields:
      - { label: "Título", name: title, widget: string }
      - { label: "Fecha", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD-MM-YYYY", time_format: false }
      - { label: "Autor", name: author, widget: string, required: false }
      - { label: "Imagen de portada", name: image, widget: image, required: false }
      - { label: "Contenido", name: body, widget: markdown }

  - name: news_en
    label: "News · English"
    label_singular: "News item"
    folder: "_news_en"
    create: true
    slug: "{{fields.title | slugify}}"
    summary: "{{fields.title}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD-MM-YYYY", time_format: false }
      - { label: "Author", name: author, widget: string, required: false }
      - { label: "Cover image", name: image, widget: image, required: false }
      - { label: "Content", name: body, widget: markdown }

  - name: news_pt
    label: "Notícias · Português"
    label_singular: "Notícia"
    folder: "_news_pt"
    create: true
    slug: "{{fields.title | slugify}}"
    summary: "{{fields.title}}"
    fields:
      - { label: "Título", name: title, widget: string }
      - { label: "Data", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD-MM-YYYY", time_format: false }
      - { label: "Autor", name: author, widget: string, required: false }
      - { label: "Imagem de capa", name: image, widget: image, required: false }
      - { label: "Conteúdo", name: body, widget: markdown }

  - name: notes_es
    label: "Notas (Publicaciones) · Español"
    folder: "_notes_es"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: title, widget: string }
      - { label: "Fecha", name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: "Autoría", name: author, widget: string, required: false }
      - { label: "Texto", name: body, widget: markdown }

  - name: notes_en
    label: "Notes (Publications) · English"
    folder: "_notes_en"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: title, widget: string }
      - { label: "Fecha", name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: "Author", name: author, widget: string, required: false }
      - { label: "Text", name: body, widget: markdown }

  - name: notes_pt
    label: "Notas (Publicações) · Português"
    folder: "_notes_pt"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: title, widget: string }
      - { label: "Fecha", name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: "Autoria", name: author, widget: string, required: false }
      - { label: "Texto", name: body, widget: markdown }
