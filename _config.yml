# ============================================================
#  Configuración del sitio EscuelasCool (trilingüe ES/EN/PT)
#  Edita los valores con cuidado (respeta los espacios).
# ============================================================

title: "EscuelasCool"
description: >-
  Proyecto de investigación financiado por el Wellcome Climate Impacts Award
  para hacer visible el impacto del calor extremo en la salud y el bienestar
  del estudiantado en América Latina, y catalizar la acción política.

# Idiomas del sitio. El primero es el idioma por defecto (raíz del sitio).
languages: ["es", "en", "pt"]
default_lang: "es"

# Dominio propio. Con dominio propio, baseurl debe quedar VACÍO.
url: "https://escuelascool.org"
baseurl: ""

# --- Colecciones ---
# Noticias y notas (blog de Publicaciones): una colección por idioma.
# Equipo y publicaciones: una sola colección; el equipo se filtra por idioma.
collections:
  news_es:
    output: true
    permalink: /noticias/:name/
  news_en:
    output: true
    permalink: /en/news/:name/
  news_pt:
    output: true
    permalink: /pt/noticias/:name/
  notes_es:
    output: true
    permalink: /publicaciones/:name/
  notes_en:
    output: true
    permalink: /en/publications/:name/
  notes_pt:
    output: true
    permalink: /pt/publicacoes/:name/
  events_es:
    output: true
    permalink: /eventos/:name/
  events_en:
    output: true
    permalink: /en/events/:name/
  events_pt:
    output: true
    permalink: /pt/eventos/:name/
  team:
    output: false
  publications:
    output: false

# --- Valores por defecto (idioma y plantilla de cada colección de noticias) ---
defaults:
  - scope: { path: "", type: "news_es" }
    values: { layout: "post", lang: "es", ref: "news" }
  - scope: { path: "", type: "news_en" }
    values: { layout: "post", lang: "en", ref: "news" }
  - scope: { path: "", type: "news_pt" }
    values: { layout: "post", lang: "pt", ref: "news" }
  - scope: { path: "", type: "notes_es" }
    values: { layout: "post", lang: "es", ref: "pubs" }
  - scope: { path: "", type: "notes_en" }
    values: { layout: "post", lang: "en", ref: "pubs" }
  - scope: { path: "", type: "notes_pt" }
    values: { layout: "post", lang: "pt", ref: "pubs" }
  - scope: { path: "", type: "events_es" }
    values: { layout: "event", lang: "es", ref: "events" }
  - scope: { path: "", type: "events_en" }
    values: { layout: "event", lang: "en", ref: "events" }
  - scope: { path: "", type: "events_pt" }
    values: { layout: "event", lang: "pt", ref: "events" }

# --- Build ---
# future: true permite publicar eventos con fecha futura.
future: true
markdown: kramdown
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
